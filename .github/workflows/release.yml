name: 发布插件

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: 核对发布版本
        run: |
          node -e 'const tag = process.env.GITHUB_REF_NAME; if (!/^\d+\.\d+\.\d+$/.test(tag) || tag !== require("./manifest.json").version || tag !== require("./package.json").version) process.exit(1)'
      - name: 测试并构建
        run: |
          npm ci --ignore-scripts
          npm test
          npm run build
      - name: 上传插件文件
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" main.js manifest.json \
            --verify-tag --title "$GITHUB_REF_NAME" --notes-from-tag
